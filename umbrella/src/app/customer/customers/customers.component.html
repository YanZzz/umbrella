<table class="table table-striped table-hover table-dark">
    <thead>
      <tr class="">
        <th scope="col">Name</th>
        <th scope="col">Contact</th>
        <th scope="col">Phone</th>
        <th scope="col"># of Emloyees</th>
        <th scope="col">Country</th>
        <th scope="col">City</th>
        <th scope="col">...</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let customer of (customers$ | async)">
        <td>{{customer.name}}</td>
        <td>{{customer.contact}}</td>   
        <td>{{customer.telephone}}</td>
        <td>{{customer.numberOfEmployees}}</td>
        <td>{{customer.country}}</td>
        <td>{{customer.city}} </td>
        <td>
            <a class="btn btn-outline-primary" [routerLink]="['/customer/edit', customer]" [state]="customer" role="button">Edit</a>
            <a class="btn btn-outline-danger" [routerLink]="['/customer/del', customer._id, customer.name]" role="button">Del</a>
        </td>
      </tr>
    </tbody>
  </table>
